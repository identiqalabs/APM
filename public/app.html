<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
	<meta http-equiv="Pragma" content="no-cache" />
	<meta http-equiv="Expires" content="0" />
	<title>Identiqa Labs</title>
	<link rel="stylesheet" href="/styles.css" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
	<div id="auth-blocker" style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:#f8f9fa;display:flex;align-items:center;justify-content:center;z-index:9999;font-family:'Inter',sans-serif;">
		<div style="text-align:center;padding:2rem;max-width:300px;">
			<img src="/identiqa.png" alt="Loading" style="height:48px;margin-bottom:1rem;opacity:0.8;">
			<div style="font-size:14px;color:#666;">Checking authentication...</div>
		</div>
	</div>

	<div id="app-content" style="display:none;">
		<header class="app-header">
			<div class="brand">
				<img src="/identiqa.png" alt="Identiqa" class="brand-logo" />
			</div>
			<div class="actions">
				<button id="create-btn" class="btn">Create</button>
				<button id="logout-btn" class="btn danger">Logout</button>
			</div>
		</header>

		<main class="container">
			<section id="create-form" class="card hidden">
				<h2>Create Widget</h2>
				<form id="widget-form" class="grid-2">
					<div>
						<label for="name">Name</label>
						<input id="name" name="name" type="text" placeholder="Name" required />
					</div>
					<div>
						<label for="url">URL</label>
						<input id="url" name="url" type="url" placeholder="https://example.com" required />
					</div>
					<div class="full">
						<label for="description">Description</label>
						<input id="description" name="description" type="text" placeholder="Description" />
					</div>
					<div class="full">
						<button type="submit" class="btn primary">Save</button>
					</div>
				</form>
				<p id="form-error" class="error"></p>
			</section>
			<section>
				<h2>Websites</h2>
				<div id="widgets" class="widget-grid"></div>
			</section>
		</main>
	</div>

	<script>
		// Simple auth check on load
		(async function () {
			try {
				const res = await fetch('/api/auth-check', {
					method: 'HEAD',
					credentials: 'include',
					cache: 'no-store'
				});

				if (!res.ok) {
					window.location.replace('/index.html');
					return;
				}

				document.getElementById('auth-blocker').style.display = 'none';
				document.getElementById('app-content').style.display = 'block';

				const script = document.createElement('script');
				script.src = '/app.js';
				document.head.appendChild(script);
			} catch (err) {
				window.location.replace('/index.html');
			}
		})();
	</script>
</body>
</html>
