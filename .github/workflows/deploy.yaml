name: Build & Deploy Lambda

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      LAMBDA_FUNCTION_NAME: APMWidgetApp        # change if needed
      LAMBDA_ROLE_ARN: arn:aws:iam::014044355279:role/APMWidgetRole  # TODO: replace
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build deployment package
        run: |
          rm -rf build lambda-package.zip
          mkdir -p build
          cp package.json package-lock.json server.js lambda.js build/
          cp -r public build/public
          cd build
          npm ci --only=production
          zip -r ../lambda-package.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Create or update Lambda function
        run: |
          set -e

          ZIP_FILE="lambda-package.zip"
          FUNC_NAME="$LAMBDA_FUNCTION_NAME"
          ROLE_ARN="$LAMBDA_ROLE_ARN"
          RUNTIME="nodejs20.x"
          HANDLER="lambda.handler"

          # Check if function exists
          if aws lambda get-function --function-name "$FUNC_NAME" >/dev/null 2>&1; then
            echo "Updating existing Lambda function..."
            aws lambda update-function-code \
              --function-name "$FUNC_NAME" \
              --zip-file fileb://$ZIP_FILE

            aws lambda update-function-configuration \
              --function-name "$FUNC_NAME" \
              --handler "$HANDLER" \
              --runtime "$RUNTIME"
          else
            echo "Creating new Lambda function..."
            aws lambda create-function \
              --function-name "$FUNC_NAME" \
              --runtime "$RUNTIME" \
              --role "$ROLE_ARN" \
              --handler "$HANDLER" \
              --zip-file fileb://$ZIP_FILE
          fi
